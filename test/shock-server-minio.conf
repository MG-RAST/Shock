[Admin]
email=test@test.com
users=test_admin

[Anonymous]
read=true
write=false
delete=false

[Address]
api-ip=0.0.0.0
api-port=7445

[External]
api-url=http://shock-server:7445

[Auth]
basic=true

[Log]
logoutput=console

[Mongodb]
hosts=shock-mongo
database=shock_integration_test

[Paths]
data=/usr/local/shock/data
logs=/var/log/shock
site=/usr/local/shock/site

[Cache]
cache_path=/var/cache/shock
cache_ttl=5M
auto_upload=true
default_location=s3
upload_workers=2

[Runtime]
expire_wait=1
GOMAXPROCS=2
max_revisions=3

[Other]
force_yes=true
