services:
  # Service for running Go tests (unit + integration)
  shock-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      shock-mongo-test:
        condition: service_healthy
      shock-server-test:
        condition: service_healthy
    environment:
      - MONGO_HOST=shock-mongo-test
      - MONGO_DATABASE=shock_test
      - SHOCK_PATH=/go/src/github.com/MG-RAST/Shock
      - SHOCK_DATA=/var/log/shock/data
      - SHOCK_LOGS=/var/log/shock
      - SHOCK_CONFIG=/etc/shock.d
      - SHOCK_AUTH=basic
      - SHOCK_ADMIN_USERS=test_admin
      - SHOCK_SERVER_URL=http://shock-server-test:7445
      - GO_TEST_ARGS=${GO_TEST_ARGS:-./...}
      - GO_TEST_COVERAGE=${GO_TEST_COVERAGE:-false}
      - GO_TEST_COVERAGE_FILE=${GO_TEST_COVERAGE_FILE:-/test-output/coverage.out}
      - GO_TEST_COVERAGE_HTML=${GO_TEST_COVERAGE_HTML:-/test-output/coverage.html}
      - GO_TEST_RESULTS_FILE=${GO_TEST_RESULTS_FILE:-/test-output/test-results.log}
    volumes:
      - .:/go/src/github.com/MG-RAST/Shock
      - ./test-output:/test-output
      - shock-test-data:/var/log/shock/data
      - shock-test-logs:/var/log/shock
      - shock-test-config:/etc/shock.d
    entrypoint: ""
    command: ["go", "test", "-v", "./shock-server/integration/...", "./shock-server/router/..."]

  # Shock server for integration testing
  shock-server-test:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      shock-mongo-test:
        condition: service_healthy
    environment:
      - MONGO_HOST=shock-mongo-test
    volumes:
      - ./test:/etc/shock.d
      - shock-server-test-data:/var/log/shock/data
      - shock-server-test-logs:/var/log/shock
    command: ["/go/bin/shock-server", "-conf", "/etc/shock.d/shock-server-test.conf"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7445/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MongoDB for testing
  shock-mongo-test:
    image: mongo:3.6
    ports:
      - "27017"
    volumes:
      - shock-mongo-test-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: --smallfiles

volumes:
  shock-test-data:
  shock-test-logs:
  shock-test-config:
  shock-mongo-test-data:
  shock-server-test-data:
  shock-server-test-logs:
